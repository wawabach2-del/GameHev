<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberNet OS - Hardcore Pro Edition</title>
<style>
  :root {
    --bg: #040706;
    --panel: #0a100d;
    --border: #142820;
    --green: #00ff88;
    --amber: #ffb800;
    --red: #ff3b5c;
    --cyan: #00e5ff;
    --text: #d8f3e5;
    --muted: #527063;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .hud {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0; font-size: 12px;
  }
  .hud-title { color: var(--green); font-weight: bold; font-size: 13px; letter-spacing: 1px; }
  .hud-stats { display: flex; gap: 8px; align-items: center; }
  .badge {
    background: rgba(0,255,136,0.06); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; color: var(--green);
  }
  .badge.amber { color: var(--amber); border-color: rgba(255,184,0,0.3); }

  .nav {
    display: flex; background: #070d0a; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 8px 4px; font-family: inherit; font-size: 11px; font-weight: bold;
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  .nav button.active {
    color: var(--green); border-bottom-color: var(--green); background: rgba(0,255,136,0.04);
  }

  .view {
    flex: 1; display: none; flex-direction: column; overflow: hidden; position: relative;
  }
  .view.active { display: flex; }

  .status-strip {
    background: #060c09; border-bottom: 1px solid var(--border);
    padding: 6px 12px; font-size: 11px; flex-shrink: 0;
  }
  .status-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .trace-bar-bg {
    width: 100%; height: 5px; background: #111e18; border-radius: 3px; overflow: hidden;
  }
  .trace-bar-fill {
    height: 100%; width: 0%; background: var(--green); transition: width 0.2s, background 0.2s;
  }

  .term-output {
    flex: 1; padding: 12px; overflow-y: auto; font-size: 12px; line-height: 1.4;
    word-break: break-word;
  }
  .line { margin-bottom: 4px; }
  .line.sys { color: var(--cyan); }
  .line.ok { color: var(--green); }
  .line.warn { color: var(--amber); }
  .line.err { color: var(--red); }
  .line.cmd { color: #ffffff; font-weight: bold; }

  .chips {
    display: flex; gap: 5px; padding: 5px 8px; overflow-x: auto;
    background: #060c09; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .chip {
    background: #0e1c17; border: 1px solid var(--border); color: var(--green);
    padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 10px;
    white-space: nowrap; cursor: pointer; flex-shrink: 0;
  }
  .chip:active { background: var(--green); color: #000; }

  .term-input-row {
    display: flex; align-items: center; background: var(--panel);
    border-top: 1px solid var(--border); padding: 7px 10px; flex-shrink: 0;
  }
  .prompt-sign { color: var(--green); font-weight: bold; margin-right: 6px; font-size: 12px; }
  .term-input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-family: inherit; font-size: 13px; outline: none;
  }
  .send-btn {
    background: var(--green); color: #000; border: none; padding: 5px 10px;
    border-radius: 4px; font-family: inherit; font-weight: bold; font-size: 11px; cursor: pointer;
  }

  .scroll-pane {
    flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px;
  }
  .card.locked { opacity: 0.4; }
  .card-title { font-weight: bold; color: var(--green); font-size: 13px; margin-bottom: 4px; }
  .card-sub { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .btn {
    width: 100%; padding: 7px; border-radius: 4px; font-family: inherit;
    font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid var(--green);
    background: rgba(0,255,136,0.1); color: var(--green); text-align: center;
  }
  .btn.primary { background: var(--green); color: #000; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; padding: 14px; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--green);
    border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .modal-title { color: var(--green); font-size: 14px; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  
  .hex-target { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; background: #040706; padding: 8px; border-radius: 4px; border: 1px solid var(--border); }
  .hex-slot { padding: 4px 8px; border: 1px solid var(--muted); border-radius: 4px; font-weight: bold; font-size: 12px; color: var(--muted); }
  .hex-slot.done { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.1); }
  .hex-slot.active { border-color: var(--amber); color: var(--amber); }
  .hex-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hex-btn { background: #0e1c17; border: 1px solid var(--border); color: var(--text); padding: 10px 4px; border-radius: 4px; font-family: inherit; font-size: 12px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

  <div class="hud">
    <div class="hud-title">CYBERNET OS // HARDCORE</div>
    <div class="hud-stats">
      <div class="badge">LVL <span id="hud-lvl">1</span>/30</div>
      <div class="badge amber">$<span id="hud-credits">150</span></div>
    </div>
  </div>

  <div class="nav">
    <button id="tab-term" class="active" onclick="switchView('term')">TERMINAL</button>
    <button id="tab-levels" onclick="switchView('levels')">30 LEVEL</button>
  </div>

  <div id="view-term" class="view active">
    <div class="status-strip">
      <div class="status-row">
        <span id="target-label">TARGET: Belum terhubung</span>
        <span id="sec-label">FW: -</span>
      </div>
      <div class="status-row">
        <span style="color:var(--muted)">TRACE PELACAKAN (AGRESIF)</span>
        <span id="trace-pct" style="color:var(--green)">0%</span>
      </div>
      <div class="trace-bar-bg"><div id="trace-fill" class="trace-bar-fill"></div></div>
    </div>

    <div id="term-output" class="term-output"></div>
    <div id="quick-chips" class="chips"></div>

    <div class="term-input-row">
      <span class="prompt-sign">root@kali:~#</span>
      <input id="term-input" class="term-input" type="text" placeholder="Ketik: help, ping, nmap..." autocomplete="off">
      <button class="send-btn" onclick="submitCommand()">EXEC</button>
    </div>
  </div>

  <div id="view-levels" class="view">
    <div id="levels-list" class="scroll-pane"></div>
  </div>

  <!-- MODAL HEX FIREWALL -->
  <div id="modal-hex" class="modal-backdrop">
    <div class="modal">
      <div class="modal-title" style="display:flex; justify-content:space-between;">
        <span>BYPASS HEX FIREWALL</span>
        <span id="hex-timer" style="color:var(--amber)">10.0s</span>
      </div>
      <div style="font-size:11px; color:var(--muted)">Cocokkan urutan blok heksadesimal sebelum waktu habis:</div>
      <div id="hex-target" class="hex-target"></div>
      <div id="hex-grid" class="hex-grid"></div>
    </div>
  </div>

<script>
let state = { unlockedLevel: 1, credits: 150 };
let activeMission = null;
let tracePct = 0;
let traceInterval = null;
let hexInterval = null;
let hexSeq = [];
let hexIndex = 0;

const LEVELS = Array.from({ length: 30 }, (_, i) => {
  const id = i + 1;
  const tier = id <= 10 ? 1 : (id <= 20 ? 2 : 3);
  const ports = [21, 22, 80, 443, 3306, 8080];
  const port = ports[id % ports.length];
  const names = [
    "Router Warnet Lokal", "Server Kampus Lama", "Kamera CCTV Kota", "Database Minimarket",
    "Node ISP Regional", "Gateway Logistik", "Server Klinik Medis", "Portal Berita Kota",
    "Arsip Kepolisian", "Mainframe Stasiun", "Bank Swasta Cabang", "Satelit Cuaca",
    "Jaringan Kereta Cepat", "Lab Bioteknologi", "Bursa Saham Lokal", "Server Cloud Korporat",
    "Sistem Pertahanan Udara", "Pembangkit Listrik", "Brankas Kripto", "Satelit Telekomunikasi",
    "Markas Intelijen", "Reaktor Fusi Eksperimental", "Jaringan Orbital", "Sindikat Darknet",
    "Mainframe Pentagon", "AI Sentral Keuangan", "Bunker Data Arktik", "Konsorsium Global",
    "Inti Pertahanan Siber", "OMEGA CORE AI"
  ];
  return {
    id,
    name: names[i],
    ip: `10.${tier * 15}.${10 + id}.${50 + id}`,
    port,
    file: `secret_lvl${id}.dat`,
    reward: 100 + id * 40,
    traceSpeed: +(0.8 + id * 0.12).toFixed(2), // Semakin tinggi level, trace makin cepat!
    hexLen: Math.min(6, 3 + Math.floor(id / 8))
  };
});

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'levels') renderLevels();
}

function printLine(text, cls = '') {
  const out = document.getElementById('term-output');
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function updateQuickChips() {
  const box = document.getElementById('quick-chips');
  box.innerHTML = '';
  const chips = [{ label: 'help', cmd: 'help' }, { label: `start ${state.unlockedLevel}`, cmd: `start ${state.unlockedLevel}` }];
  
  if (activeMission) {
    if (!activeMission.pinged) chips.push({ label: `ping ${activeMission.ip}`, cmd: `ping ${activeMission.ip}` });
    if (activeMission.pinged && !activeMission.nmap) chips.push({ label: `nmap ${activeMission.ip}`, cmd: `nmap ${activeMission.ip}` });
    if (activeMission.nmap && !activeMission.hexCleared) chips.push({ label: 'bypass_fw', cmd: 'bypass_fw' });
    if (activeMission.hexCleared && !activeMission.rooted) chips.push({ label: `exploit ${activeMission.port}`, cmd: `exploit ${activeMission.port}` });
    if (activeMission.rooted) chips.push({ label: 'ls', cmd: 'ls' }, { label: `cat ${activeMission.file}`, cmd: `cat ${activeMission.file}` });
  }

  chips.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = c.label;
    btn.onclick = () => { document.getElementById('term-input').value = c.cmd; submitCommand(); };
    box.appendChild(btn);
  });
}

function startMission(id) {
  if (id > state.unlockedLevel) return;
  if (traceInterval) clearInterval(traceInterval);
  if (hexInterval) clearInterval(hexInterval);
  document.getElementById('modal-hex').classList.remove('open');

  const lvl = LEVELS[id - 1];
  activeMission = { ...lvl, pinged: false, nmap: false, hexCleared: false, rooted: false };
  tracePct = 0;
  switchView('term');

  document.getElementById('term-output').innerHTML = '';
  printLine(`[!] KAMPANYE LEVEL ${lvl.id}: ${lvl.name.toUpperCase()} DIMULAI`, 'sys');
  printLine(`[!] Target IP: ${lvl.ip} | Trace Speed: ${lvl.traceSpeed}x (Agresif)`, 'warn');
  printLine(`Ketik "ping ${lvl.ip}" atau gunakan chip perintah cepat di bawah.`, '');
  
  document.getElementById('target-label').textContent = `TARGET: ${lvl.ip}`;
  document.getElementById('sec-label').textContent = `FW: AKTIF`;
  updateQuickChips();

  traceInterval = setInterval(() => {
    if (!activeMission) return;
    tracePct = Math.min(100, tracePct + activeMission.traceSpeed);
    document.getElementById('trace-fill').style.width = tracePct + '%';
    document.getElementById('trace-pct').textContent = Math.floor(tracePct) + '%';
    
    if (tracePct >= 100) {
      clearInterval(traceInterval);
      if (hexInterval) clearInterval(hexInterval);
      document.getElementById('modal-hex').classList.remove('open');
      printLine('!!! TRACE 100%! KONEKSI DIPUTUS PAKSA OLEH FIREWALL TARGET! !!!', 'err');
      activeMission = null;
      document.getElementById('target-label').textContent = 'TARGET: Terputus';
      updateQuickChips();
    }
  }, 1000);
}

document.getElementById('term-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitCommand();
});

function submitCommand() {
  const inp = document.getElementById('term-input');
  const raw = inp.value.trim();
  if (!raw) return;
  inp.value = '';
  printLine(`root@kali:~# ${raw}`, 'cmd');

  const parts = raw.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts[1] || '';

  if (cmd === 'help') {
    printLine('Perintah: start [1-30], ping [ip], nmap [ip], bypass_fw, exploit [port], ls, cat [file], clear', 'sys');
  } else if (cmd === 'clear') {
    document.getElementById('term-output').innerHTML = '';
  } else if (cmd === 'start') {
    startMission(parseInt(arg) || state.unlockedLevel);
  } else if (!activeMission) {
    printLine('Tidak ada misi aktif. Pilih level di tab [30 LEVEL] atau ketik "start 1".', 'err');
  } else if (cmd === 'ping') {
    if (arg !== activeMission.ip) { printLine('Host unreachable.', 'err'); return; }
    activeMission.pinged = true;
    printLine(`PING ${activeStatus(activeMission.ip)} 56 bytes. Host aktif.`, 'ok');
    printLine('-> Jalankan pemindaian port: "nmap [ip]"', 'sys');
    updateQuickChips();
  } else if (cmd === 'nmap
